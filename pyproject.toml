[project]
name = "ostinato"
version = "0.4.0"
description = "Ostinato: a sequencer you can talk to, standalone or on hardware. A device server with generic sequences, staffs and generative algorithms over device backends (a virtual General MIDI device, the M-VAVE FM-1 with SLOOP), and a device-independent MCP shim"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "androbi", email = "denk@us.es" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "mido>=1.3.3",
    "music21>=10.5.2",
    "python-rtmidi>=1.5.8",
    "resvg-py>=0.5.0",
    "verovio>=6.4.1",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
]

[project.scripts]
ostinato-mcp = "ostinato.shim:main"
ostinato-device = "ostinato.device_server:main"
ostinato = "ostinato.launcher:main"

[project.gui-scripts]
ostinato-tray = "ostinato.tray:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ostinato"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
build = [
    "pyinstaller>=6.11",
]
